# CI resolves the real image before apply:
#   kustomize edit set image \
#     landvex/opportunity-engine=$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/landvex/opportunity-engine:$IMAGE_TAG
# then `kubectl apply -k deploy/k8s`.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: landvex
resources:
  - namespace.yaml
  - configmap.yaml
  - secret.example.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml
images:
  - name: landvex/opportunity-engine
    newTag: latest
