# Template only — never fill in real values here. Mirrors the secret
# ARNs in deploy/aws/task-definition.json ("secrets" list): the same
# five variables cross into the container as a secret, whichever path
# runs it. Until an External Secrets Operator / Secrets Manager CSI
# driver is provisioned in landvex-prod (docs/k8s.md, gap #8), create the
# real object out of band, e.g.:
#
#   kubectl create secret generic landvex-secrets -n landvex \
#     --from-literal=LANDVEX_API_KEYS='key:tenant:role:plan' \
#     --from-literal=LANDVEX_JWT_SECRET='...' \
#     --from-literal=LANDVEX_PG_DSN='postgresql://user:pass@host:5432/landvex' \
#     --from-literal=LANDVEX_TRAFFIC_KEY='...' \
#     --from-literal=LANDVEX_AIR_KEY='...'
#
# and never commit the output of `kubectl get secret -o yaml`.
apiVersion: v1
kind: Secret
metadata:
  name: landvex-secrets
  namespace: landvex
type: Opaque
stringData:
  LANDVEX_API_KEYS: ""
  LANDVEX_JWT_SECRET: ""
  LANDVEX_PG_DSN: ""
  LANDVEX_TRAFFIC_KEY: ""
  LANDVEX_AIR_KEY: ""
