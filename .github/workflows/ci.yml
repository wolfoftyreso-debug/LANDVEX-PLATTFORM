# LANDVEX Opportunity Engine — CI.
# Beroendefri kärna: hela sviten körs utan pip install och utan nätverk.
name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile (syntax + imports)
        run: python -m compileall -q engine api integrations tests scripts
      - name: Lint (ruff — se ruff.toml för varför varje regel är på)
        run: |
          pip install --quiet ruff
          ruff check .
      - name: Test suite (auto-discovered, no deps, no network)
        run: |
          for t in tests/test_*.py; do
            m="tests.$(basename "$t" .py)"; echo "── $m"; python -m "$m"
          done
