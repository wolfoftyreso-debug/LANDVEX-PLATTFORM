# LANDVEX Opportunity Engine — CI.
# Beroendefri kärna: hela sviten körs utan pip install och utan nätverk.
name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile (syntax + imports)
        run: python -m compileall -q engine api integrations tests scripts
      - name: Lint (ruff — se ruff.toml för varför varje regel är på)
        run: |
          pip install --quiet ruff
          ruff check .
      - name: Performance budget (BÅDA lägena)
        # Budgeten fanns och verktyget fanns, men ingenting körde dem:
        # /v1/saturation låg 12,6x över sin egen budget utan att någon
        # grind sa ifrån. --live krävs eftersom LANDVEX_LIVE=0 hoppar
        # över just den väg som var långsam.
        run: |
          python -m scripts.measure_api --runs 20 --out /tmp/lv-mock.json
          python -m scripts.perf_budget /tmp/lv-mock.json \
            --budgets docs/landvex-budgets.json
          python -m scripts.measure_api --runs 20 --live --out /tmp/lv-live.json
          python -m scripts.perf_budget /tmp/lv-live.json \
            --budgets docs/landvex-budgets.json
      - name: Demo (fäller sig själv om ett steg inte stämmer)
        run: python -m scripts.demo90
      - name: Test suite (auto-discovered, no deps, no network)
        run: |
          for t in tests/test_*.py; do
            m="tests.$(basename "$t" .py)"; echo "── $m"; python -m "$m"
          done
