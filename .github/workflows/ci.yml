# LANDVEX Opportunity Engine — CI.
# Beroendefri kärna: hela sviten körs utan pip install och utan nätverk.
name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile (syntax + imports)
        run: python -m compileall -q engine api integrations tests scripts
      - name: Lint (ruff — se ruff.toml för varför varje regel är på)
        run: |
          pip install --quiet ruff
          ruff check .
      - name: Performance budget (motortid)
        # MEDVETET utan --live. LANDVEX_LIVE=1 pekar på riktiga
        # myndighets-API:er (api.scb.se m.fl.), och ett bygge ska varken
        # bero på en tredje parts drifttid eller belasta ett offentligt
        # API vid varje push. Siffran här är motortid: deterministisk,
        # jämförbar mellan körningar, och det enda ett bygge rimligen
        # kan uttala sig om.
        #
        # Den levande vägen mäts med `make measure-live` mot en miljö där
        # någon medvetet valt att ringa ut. Att den inte mäts HÄR står
        # utskrivet i verktygets egen utdata — omätt är inte detsamma
        # som snabbt.
        run: |
          python -m scripts.measure_api --runs 20 --out /tmp/lv-mock.json
          python -m scripts.perf_budget /tmp/lv-mock.json \
            --budgets docs/landvex-budgets.json
      - name: Demo (fäller sig själv om ett steg inte stämmer)
        run: python -m scripts.demo90
      - name: Test suite (auto-discovered, no deps, no network)
        run: |
          for t in tests/test_*.py; do
            m="tests.$(basename "$t" .py)"; echo "── $m"; python -m "$m"
          done
