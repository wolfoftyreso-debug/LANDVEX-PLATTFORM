# nginx-montering för Opportunity Engine bakom api.landvex.io.
# ÖPPEN FRÅGA (Erik/Johan): ersätta v0 eller mountas parallellt som /v1/?
# Detta utkast mountar parallellt under /v1/ utan att röra v0-uppströmmen.
# Inkluderas från landvex-ssl.conf (server-blocket för api.landvex.io).

location /v1/ {
    proxy_pass http://127.0.0.1:8087;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Request-ID $request_id;
    proxy_read_timeout 30s;
}

location = /health {
    proxy_pass http://127.0.0.1:8087/health;
}

location = /openapi.json {
    proxy_pass http://127.0.0.1:8087/openapi.json;
}
