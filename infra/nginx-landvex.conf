# nginx: landvex.com → LANDVEX Opportunity Engine.
# TLS termination + security headers + gzip + rate limiting; proxies the
# whole app (frontend at / and the /v1 API) to the container/service on
# 127.0.0.1:8000 (docker-compose `app`) — adjust `proxy_pass` to :8087 for
# the systemd deployment.
#
# Certs via certbot:
#   certbot certonly --webroot -w /var/www/certbot -d landvex.com -d www.landvex.com

limit_req_zone $binary_remote_addr zone=landvex_api:10m rate=20r/s;

upstream landvex_app {
    server 127.0.0.1:8000;   # docker-compose: use `app:8000`
    keepalive 16;
}

# HTTP → HTTPS + ACME challenge.
server {
    listen 80;
    listen [::]:80;
    server_name landvex.com www.landvex.com;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://landvex.com$request_uri; }
}

# Canonicalise www → apex over TLS.
server {
    listen 443 ssl;
    http2 on;
    server_name www.landvex.com;
    ssl_certificate     /etc/letsencrypt/live/landvex.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/landvex.com/privkey.pem;
    return 301 https://landvex.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name landvex.com;

    ssl_certificate     /etc/letsencrypt/live/landvex.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/landvex.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # Security headers.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "SAMEORIGIN" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types application/json application/javascript text/css text/plain image/svg+xml;
    gzip_min_length 1024;

    client_max_body_size 2m;

    # API: rate-limited, no caching, request-id passthrough.
    location /v1/ {
        limit_req zone=landvex_api burst=40 nodelay;
        proxy_pass http://landvex_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_read_timeout 30s;
    }

    location = /health { proxy_pass http://landvex_app; access_log off; }
    location = /metrics {
        # Ops-only: restrict to internal network before exposing.
        allow 127.0.0.1; allow 10.0.0.0/8; deny all;
        proxy_pass http://landvex_app;
    }

    # Frontend + everything else.
    location / {
        proxy_pass http://landvex_app;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
