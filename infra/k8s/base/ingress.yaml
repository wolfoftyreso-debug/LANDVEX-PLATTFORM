# Traefik (k3s default ingress). Patch the hosts in your overlay — see
# overlays/prod. TLS: cert-manager ClusterIssuer (optional/cert-manager.yaml)
# or your own certificates as a TLS secret.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: baltic-bridge
  namespace: baltic-bridge
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
spec:
  ingressClassName: traefik
  tls:
    - hosts: [www.example.com]
      secretName: app-tls
    - hosts: [files.example.com]
      secretName: files-tls
  rules:
    - host: www.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: app
                port:
                  number: 3000
    # MinIO S3 API — must match S3_ENDPOINT exactly (presigned signatures
    # include the host).
    - host: files.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: minio
                port:
                  number: 9000
