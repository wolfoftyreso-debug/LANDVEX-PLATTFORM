# TEMPLATE ONLY — never commit a filled-in copy. Create the real secret with:
#   kubectl -n baltic-bridge create secret generic baltic-bridge-env \
#     --from-env-file=.env.selfhost
# (the same env file the compose stack uses; see .env.selfhost.example)
#
# Required keys (superset of compose): POSTGRES_USER, POSTGRES_PASSWORD,
# POSTGRES_DB, DATABASE_URL (postgres://user:pass@db:5432/baltic_bridge),
# AUTH_SECRET, PUBLIC_BASE_URL, S3_ENDPOINT (public files host!), S3_REGION,
# S3_ACCESS_KEY_ID, S3_SECRET_ACCESS_KEY, S3_DOCUMENTS_BUCKET,
# S3_FORCE_PATH_STYLE=true, MINIO_ROOT_USER, MINIO_ROOT_PASSWORD,
# EMAIL_PROVIDER (smtp|console), EMAIL_FROM, SMTP_HOST, SMTP_PORT,
# SMTP_SECURE, SMTP_USER, SMTP_PASSWORD, CRON_SECRET.
apiVersion: v1
kind: Secret
metadata:
  name: baltic-bridge-env
  namespace: baltic-bridge
type: Opaque
stringData:
  POSTGRES_USER: baltic
  POSTGRES_PASSWORD: change-me
  POSTGRES_DB: baltic_bridge
  DATABASE_URL: postgres://baltic:change-me@db:5432/baltic_bridge
  AUTH_SECRET: change-me
  PUBLIC_BASE_URL: https://www.example.com
  S3_ENDPOINT: https://files.example.com
  S3_REGION: eu-north-1
  S3_ACCESS_KEY_ID: baltic
  S3_SECRET_ACCESS_KEY: change-me
  S3_DOCUMENTS_BUCKET: documents
  S3_FORCE_PATH_STYLE: "true"
  MINIO_ROOT_USER: baltic
  MINIO_ROOT_PASSWORD: change-me
  EMAIL_PROVIDER: console
  EMAIL_FROM: no-reply@example.com
  CRON_SECRET: change-me
