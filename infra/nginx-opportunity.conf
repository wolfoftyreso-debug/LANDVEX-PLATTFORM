# nginx: opportunity.landvex.com → Opportunity Engine (:8087).
# Domänbeslut: egen subdomän (ej api.landvex.io/v1/). SSL återanvänder
# landvex.com-certifikatet (wildcard/SAN) enligt AAMOS-dev.
server {
    listen 443 ssl;
    server_name opportunity.landvex.com;

    ssl_certificate     /etc/letsencrypt/live/landvex.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/landvex.com/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:8087;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_read_timeout 30s;
    }
}

server {
    listen 80;
    server_name opportunity.landvex.com;
    return 301 https://$host$request_uri;
}
